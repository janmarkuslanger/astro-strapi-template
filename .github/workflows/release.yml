name: Release

# Publishes the platform package to npm when a version tag is pushed.
#
#   node scripts/set-version.mjs 0.2.0 && npm install
#   git commit -am "Release 0.2.0" && git tag v0.2.0 && git push --follow-tags
#
# - One version: sites reference the package and the reusable workflows by
#   the same tag.
# - Prerelease (`v0.2.0-rc.1`) → dist-tag `next`; stable → `latest`.
# - Rerunnable: versions already on npm are skipped, so a failed run can be
#   retried on the same tag.
#
# Auth: trusted publishing (OIDC, id-token below), no stored token.
# - It can only be configured for a package that exists on npm, so the very
#   first version is published once by hand, with 2FA: on a clean main,
#   `npm ci && npm test && npm publish --workspace packages/powerhouse --access public`.
# - Then on npmjs.com: package Settings → Trusted Publisher → GitHub Actions,
#   this repository, workflow release.yml; and Publishing access → require
#   2FA and disallow tokens. Push the version tag afterwards; this workflow
#   skips the version already on npm.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  id-token: write # trusted publishing + provenance

env:
  PACKAGES: packages/powerhouse

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No dependency cache: this job holds publish credentials.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@^11.5.1

      - name: Tag and package versions must agree
        run: |
          set -euo pipefail
          want="${GITHUB_REF_NAME#v}"
          for dir in $PACKAGES; do
            have="$(node -p "require('./$dir/package.json').version")"
            if [ "$have" != "$want" ]; then
              echo "::error::$dir is $have, tag says $want. Run scripts/set-version.mjs first."
              exit 1
            fi
          done

      - run: npm ci

      # Never publish what fails its tests.
      - run: npm test

      - run: npm run build:packages

      # npm authenticates through OIDC (trusted publishing); no token here.
      - name: Publish
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac

          for dir in $PACKAGES; do
            name="$(node -p "require('./$dir/package.json').name")"

            # Prints the version: already published. E404: not on npm yet.
            # Any other failure is a real error, never a reason to skip.
            if published="$(npm view "$name@$version" version 2>npm-view.err)"; then
              if [ "$published" = "$version" ]; then
                echo "$name@$version is already published — skipped."
                continue
              fi
            elif ! grep -q E404 npm-view.err; then
              cat npm-view.err
              echo "::error::Could not look up $name@$version on npm."
              exit 1
            fi

            npm publish --workspace "$dir" --provenance --access public --tag "$dist_tag"
          done
