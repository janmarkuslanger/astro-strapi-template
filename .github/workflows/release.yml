name: Release

# Publishes every platform package to npm when a version tag is pushed.
#
#   node scripts/set-version.mjs 0.2.0 && npm install
#   git commit -am "Release 0.2.0" && git tag v0.2.0 && git push --follow-tags
#
# - Lockstep: all packages share one version, and sites reference the reusable
#   workflows by the same tag.
# - Prerelease (`v0.2.0-rc.1`) → dist-tag `next`; stable → `latest`.
# - Rerunnable: versions already on npm are skipped, so a failed run can be
#   retried on the same tag.
#
# Auth (npm has no classic/automation tokens since 2025-12-09):
# - First release: secret NPM_TOKEN = granular token, read/write for the
#   @janmarkuslanger scope, "bypass 2FA" enabled.
# - Afterwards: add this workflow as trusted publisher for each package on
#   npmjs.com, then delete NPM_TOKEN. npm uses OIDC (id-token below).

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  id-token: write # trusted publishing + provenance

env:
  # Publish order: dependencies before dependents.
  PACKAGES: packages/core packages/cms-strapi packages/astro packages/strapi-kit

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No dependency cache: this job holds publish credentials.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@^11.5.1

      - name: Tag and package versions must agree
        run: |
          set -euo pipefail
          want="${GITHUB_REF_NAME#v}"
          for dir in $PACKAGES; do
            have="$(node -p "require('./$dir/package.json').version")"
            if [ "$have" != "$want" ]; then
              echo "::error::$dir is $have, tag says $want. Run scripts/set-version.mjs first."
              exit 1
            fi
          done

      - run: npm ci

      - run: npm run build:packages

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac

          for dir in $PACKAGES; do
            name="$(node -p "require('./$dir/package.json').name")"

            # Prints the version: already published. E404: not on npm yet.
            # Any other failure is a real error, never a reason to skip.
            if published="$(npm view "$name@$version" version 2>npm-view.err)"; then
              if [ "$published" = "$version" ]; then
                echo "$name@$version is already published — skipped."
                continue
              fi
            elif ! grep -q E404 npm-view.err; then
              cat npm-view.err
              echo "::error::Could not look up $name@$version on npm."
              exit 1
            fi

            npm publish --workspace "$dir" --provenance --access public --tag "$dist_tag"
          done
