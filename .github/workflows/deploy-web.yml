name: Deploy frontend

# Builds the static site against the live CMS.
#
# REUSABLE ACROSS REPOSITORIES: sites call it as
#   uses: janmarkuslanger/astro-strapi-template/.github/workflows/deploy-web.yml@<tag>
# and pass every value explicitly (secrets declared below; `secrets: inherit`
# only works within one organization). It checks out and builds the CALLER's
# repository. The same steps run after a code deploy and after a content
# rebuild; callers share a concurrency group so two runs never ship over each
# other.
#
# TARGET-AGNOSTIC: everything above "Ship" is identical for every hosting
# target. `deploy-target` picks the shipping step; leave it empty when the
# host builds by itself (Vercel/Netlify/Cloudflare) and this is only a check.

on:
  workflow_call:
    inputs:
      strapi-url:
        description: Build-time CMS address (never reaches the browser)
        required: true
        type: string
      deploy-target:
        description: "'ssh' to upload a release over SSH; empty to only build and verify"
        required: false
        type: string
        default: ""
      web-root:
        description: "deploy-target ssh: web root on the server (releases/ + current symlink)"
        required: false
        type: string
        default: ""
      site-url:
        description: Public site URL for the health check; empty skips it
        required: false
        type: string
        default: ""
    secrets:
      STRAPI_TOKEN: { required: false }
      SSH_PRIVATE_KEY: { required: false }
      SSH_KNOWN_HOSTS: { required: false }
      SSH_USER: { required: false }
      SSH_HOST: { required: false }

env:
  # Where the built site ends up. Same for every target.
  DIST: apps/web/dist
  # Inputs reach scripts only through env. `${{ }}` inside `run:` is pasted
  # into the script text before the shell parses it.
  WEB_ROOT: ${{ inputs.web-root }}
  SITE_URL: ${{ inputs.site-url }}
  SSH_TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # A site created from the template carries the platform's package
      # sources until `npm run init-site`; npm would build with those stale
      # local copies instead of the published packages.
      - name: Site must be initialized
        run: |
          if [ "$GITHUB_REPOSITORY" != "janmarkuslanger/astro-strapi-template" ] && [ -d packages/core ]; then
            echo "::error::Platform package sources found. Run 'npm run init-site' once, then npm install and commit."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # NOTE: no PUBLIC_* variables here, deliberately.
      #
      # Everything the visitor sees comes from the committed
      # apps/web/.env.production, which Astro loads on every build machine —
      # that is what keeps CI and any other build path identical. `${{ vars.X }}`
      # yields an empty string when a variable is unset, and an
      # exported-but-empty value silently OVERRIDES the file. See CLAUDE.md §3.
      #
      # STRAPI_URL is build-time only and never reaches the browser, so it may
      # legitimately differ per build path.
      - name: Build the site against the CMS
        env:
          STRAPI_URL: ${{ inputs.strapi-url }}
          STRAPI_TOKEN: ${{ secrets.STRAPI_TOKEN }}
        run: npm run build:web

      # A site that lost its consent banner still returns HTTP 200 — the only
      # way to notice is to assert before shipping.
      - name: Verify the build carries its public config
        run: |
          set -euo pipefail
          ga_id="$(sed -n 's/^PUBLIC_GA_MEASUREMENT_ID=//p' apps/web/.env.production | tr -d '"'"'"' \r')"
          if [ -n "$ga_id" ]; then
            if grep -rqF "$ga_id" "$DIST"; then
              echo "OK: measurement id present in the build."
            else
              echo "::error::Build does not contain $ga_id — the consent banner is missing too. Not shipping."
              exit 1
            fi
          else
            echo "No measurement id configured — skipping the check."
          fi
          if grep -rq "127\.0\.0\.1" "$DIST"; then
            echo "::error::Build contains 127.0.0.1 — visitors cannot load that. Check PUBLIC_STRAPI_URL."
            exit 1
          fi

      # ------------------------------------------------------------------
      # Ship — selected by `deploy-target`.
      # ------------------------------------------------------------------

      # Target: Vercel / Netlify / Cloudflare Pages — leave deploy-target
      # empty: the platform builds by itself, this run is only the check.

      # Target: any static host over SSH (vServer, shared hosting with rsync)
      - name: Set up SSH
        if: inputs.deploy-target == 'ssh'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload as a new release and switch atomically
        if: inputs.deploy-target == 'ssh'
        run: |
          set -euo pipefail
          # An unset repository variable arrives as "". Without this check the
          # release lands in /releases and the switch runs in $HOME.
          if [ -z "$WEB_ROOT" ]; then
            echo "::error::deploy-target is ssh but web-root is empty."
            exit 1
          fi

          # One directory per run: a content rebuild carries the same commit as
          # the deploy before it, so the sha alone would collide.
          RELEASE="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          SSH="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes"

          $SSH "$SSH_TARGET" "mkdir -p $(printf %q "$WEB_ROOT/releases/$RELEASE")"

          rsync -az --delete -e "$SSH" \
            "$DIST/" "$SSH_TARGET:$WEB_ROOT/releases/$RELEASE/"

          # Values travel as quoted positional arguments; the heredoc is quoted,
          # so nothing inside it is expanded on the runner.
          $SSH "$SSH_TARGET" \
            "bash -euo pipefail -s -- $(printf '%q ' "$WEB_ROOT" "$RELEASE")" <<'REMOTE'
            cd "$1"
            # Atomic: the web server follows the symlink per request, so no
            # visitor ever sees a half-copied release.
            ln -sfn "releases/$2" current.tmp
            mv -Tf current.tmp current
            # Keep five for a one-command rollback.
            ls -1dt releases/*/ | tail -n +6 | xargs -r rm -rf
          REMOTE

      - name: Health check
        if: inputs.site-url != ''
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL" || true)
            [ "$code" = "200" ] && { echo "Site is responding."; exit 0; }
            echo "Attempt $i: HTTP $code — waiting …"
            sleep 5
          done
          echo "::error::Site did not respond within 50s."
          exit 1
