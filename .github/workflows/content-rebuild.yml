name: Content rebuild

# Rebuilds the site — the MANUAL FALLBACK.
#
# The regular path after a publish does not go through GitHub: see
# packages/strapi-kit/src/rebuild.ts (strategy "hook" or "script"). That is faster and
# works even when GitHub does not.
#
# This workflow stays for the case where the normal path is stuck — a broken
# toolchain, a full disk, "please rebuild from a clean checkout". Start it by
# hand under Actions, or send a repository_dispatch of type content-published.
#
# Debounce: same concurrency group as the code deploy. While a run is in
# progress further publishes queue as a single pending run (GitHub cancels the
# older pending one), so ten publishes cost one build.

on:
  repository_dispatch:
    types: [content-published]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  web:
    uses: ./.github/workflows/deploy-web.yml
    secrets: inherit
