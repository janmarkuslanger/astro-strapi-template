name: Deploy

# One pipeline for both halves, because their order matters: the frontend is
# built statically against the CMS, so a page using a new block only builds
# once Strapi knows that component. The web job therefore always waits.
#
# This file is the CALLER, and the template for a site's own deploy.yml. The
# logic lives in the reusable workflows; a site references them by tag:
#   uses: janmarkuslanger/astro-strapi-template/.github/workflows/build-web.yml@vX.Y.Z
# (this repo uses ./ paths because it is the platform repo itself).
#
# Hosters differ per customer, so this file is where a site says where things
# go: `cms` and `ship` are the hoster-specific jobs. The SSH recipes below
# are one option; replace either job with another recipe from
# docs/deployment-targets.md. `web` (build and verify) stays as it is.
#
# Values come from repository variables and secrets and are passed
# explicitly — `secrets: inherit` does not cross organizations. None of them
# is PUBLIC_*: public build config lives in apps/web/.env.production
# (CLAUDE.md §3).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never two deployments against the same environment at once. Shared with
# content-rebuild.yml so a publish cannot overlap a code deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  cms:
    # Strapi on a server reachable over SSH. On a hoster that builds from the
    # repo itself (Strapi Cloud, Render, …), delete this job and drop
    # `needs: cms` below. Skips itself when nothing the server builds from
    # changed.
    if: vars.CMS_TARGET == 'ssh'
    uses: ./.github/workflows/deploy-cms-ssh.yml
    with:
      app-dir: ${{ vars.APP_DIR }}
      shared-dir: ${{ vars.SHARED_DIR }}
      restart-command: ${{ vars.CMS_RESTART_COMMAND }}
      cms-url: ${{ vars.CMS_URL }}
      web-root: ${{ vars.WEB_ROOT }}
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.SSH_HOST }}

  web:
    # Runs after the CMS is up — also when the cms job was skipped, but never
    # after a FAILED CMS deploy: building the frontend against a half-deployed
    # CMS is exactly what this avoids.
    needs: cms
    if: always() && needs.cms.result != 'failure' && needs.cms.result != 'cancelled'
    uses: ./.github/workflows/build-web.yml
    with:
      strapi-url: ${{ vars.STRAPI_URL }}
    secrets:
      STRAPI_TOKEN: ${{ secrets.STRAPI_TOKEN }}

  ship:
    # Puts the built site where it is served. Over SSH here; for another
    # hoster, replace this job with its recipe (docs/deployment-targets.md).
    # Hosters that build by themselves (Vercel, Netlify, Cloudflare Pages)
    # need no ship job: `web` is then the check.
    needs: web
    if: vars.WEB_TARGET == 'ssh'
    uses: ./.github/workflows/ship-web-ssh.yml
    with:
      web-root: ${{ vars.WEB_ROOT }}
      site-url: ${{ vars.SITE_URL }}
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
